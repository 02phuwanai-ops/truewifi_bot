<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Local Ping Test Sandbox</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 30px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #00E676; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #00C853; }
        .result { margin-top: 15px; font-size: 16px; font-weight: bold; }
        .test-ok { color: #00E676; }
        .test-false { color: #FF5252; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔍 ทดสอบ Ping AP (Local)</h3>
        <label>Employee ID:</label>
        <input type="text" id="empId" value="01047981">
        
        <label>AP IP Address:</label>
        <input type="text" id="ipAddress" value="10.142.167.193">
        
        <button onclick="runTest()">คลิกเพื่อทดสอบ Ping</button>
        
        <div class="result" id="resultBox">สถานะ: รอการทดสอบ...</div>
    </div>

    <script>
        async function runTest() {
            const ip = document.getElementById('ipAddress').value.trim();
            const empId = document.getElementById('empId').value.trim();
            const resultBox = document.getElementById('resultBox');

            resultBox.innerHTML = "⏳ กำลังทดสอบผ่านระบบอัตโนมัติ...";
            resultBox.className = "result";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/ping_test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip, emp_id: empId })
                });
                const data = await response.json();

                if (data.message === "Test OK") {
                    resultBox.innerHTML = `🟢 ผลลัพธ์: <span class="test-ok">${data.message}</span>`;
                } else {
                    resultBox.innerHTML = `🔴 ผลลัพธ์: <span class="test-false">${data.message}</span>`;
                }
            } catch (error) {
                resultBox.innerHTML = `🔴 ผลลัพธ์: <span class="test-false">test false. (Connection Error)</span>`;
            }
        }
    </script>

</body>
</html>
